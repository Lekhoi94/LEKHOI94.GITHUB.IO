   BUTTON CHUNG
===================================================== */

    min-width:135px;

    font-size:15px;
    font-weight:bold;
    border:none;
    border-radius:12px;
    cursor:pointer;
    color:#fff;
    margin:4px;
    transition:
        transform .15s,
        box-shadow .15s,
        filter .15s;
    box-shadow:
        0 4px 10px rgba(0,0,0,.4);
}

button:hover{
    filter:brightness(1.12);
    transform:translateY(-2px);
    box-shadow:
        0 7px 18px rgba(0,0,0,.55);
}

button:active{
    transform:scale(.95);
}

<script>

/* =====================================================
   HÀM HIỂN THỊ
===================================================== */

function hienThi(noiDung){

    document.getElementById("preview").innerHTML =
        noiDung;

}

/* =====================================================
   VIETTEL - NẠP THẺ
===================================================== */

function guiSMS(){

    let maThe =
        document.getElementById("mathe").value.trim();

    if(maThe === ""){

        alert("⚠️ Vui lòng nhập mã thẻ!");

        document.getElementById("mathe").focus();

        return;
    }

    if(!/^[a-zA-Z0-9]+$/.test(maThe)){

        alert("⚠️ Mã thẻ chỉ được chứa chữ và số!");

        return;
    }

    let ussd =
        "*100*" + maThe + "#";

    let noiDung =
        "NT " + maThe;

    hienThi(
        "USSD: <b>" + ussd + "</b><br>" +
        "SMS: <b>" + noiDung + "</b><br>" +

/* =====================================================
   CCCD
===================================================== */

function moNhapCCCD(){

    document.getElementById("cccdBox").style.display =
        "block";

    document.getElementById("cccd").value="";

    setTimeout(function(){

        document.getElementById("cccd").focus();

    },100);

}

function dongCCCD(){

    document.getElementById("cccdBox").style.display =
        "none";

    document.getElementById("cccd").value="";

}

function guiCCCD(){

    let cccd =
        document.getElementById("cccd").value.trim();

    if(!/^\d{12}$/.test(cccd)){

        alert("⚠️ CCCD phải gồm đúng 12 số!");

        document.getElementById("cccd").focus();

        return;
    }

    let noiDung =
        "TTTB " + cccd;

    hienThi(
        "SMS: <b>" + noiDung + "</b><br>" +
        "Gửi đến: <b>1414</b>"
    );

    dongCCCD();

    window.location.href =
        "sms:1414?body=" +
        encodeURIComponent(noiDung);

}

/* =====================================================
   PWA INSTALL
===================================================== */

let deferredPrompt=null;

window.addEventListener(
    "beforeinstallprompt",
    function(e){

        e.preventDefault();

        deferredPrompt=e;

        const btn =
            document.getElementById("installBtn");

        btn.style.display="inline-block";

        btn.onclick=async function(){

            if(!deferredPrompt){

                return;

            }

            deferredPrompt.prompt();

            const choice =
                await deferredPrompt.userChoice;

            console.log(
                "Kết quả cài:",
                choice.outcome
            );

            deferredPrompt=null;

            btn.style.display="none";

        };

    }
);

/* =====================================================
   APP INSTALLED
===================================================== */

window.addEventListener(
    "appinstalled",
    function(){

        const btn =
            document.getElementById("installBtn");

        btn.style.display="none";

        deferredPrompt=null;

    }
);

</script>
